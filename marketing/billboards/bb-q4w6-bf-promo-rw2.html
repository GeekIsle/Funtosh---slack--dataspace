<!doctype html><html><head><meta charset="utf-8"><style>@font-face{font-family:IS;src:url(src/fonts/InstrumentSans.ttf)}
@font-face{font-family:FG;src:url(src/fonts/Figtree.ttf)}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:FG,sans-serif;color:#020624;position:relative;overflow:hidden}
.kick{display:inline-block;font-weight:800;letter-spacing:4px;text-transform:uppercase;color:#1a9b4d;border:2px solid #2ad265;border-radius:999px}
.grad{background:linear-gradient(90deg,#007ae7,#2ad265);-webkit-background-clip:text;background-clip:text;color:transparent}
.btn{display:inline-block;background:linear-gradient(90deg,#007ae7,#2ad265);color:#fff;border-radius:999px;font-weight:800;letter-spacing:2px;text-transform:uppercase}
.tile{position:relative;border-radius:30px;background:#fff;border:1.5px solid #e4ebe6;box-shadow:0 14px 30px -20px rgba(2,6,36,.35);display:flex;align-items:center;justify-content:center;overflow:hidden}
.tile img{object-fit:contain;filter:drop-shadow(0 22px 20px rgba(2,6,36,.22))}
.tile.hero{background:linear-gradient(135deg,#007ae7,#2ad265)}
.chip{position:absolute;top:20px;left:20px;font-family:IS;font-weight:700;color:#fff;background:#020624;border-radius:14px}
.hero .chip{background:#fff;color:#020624}
.lbl{position:absolute;left:22px;right:18px;bottom:18px;font-weight:800;letter-spacing:1px;text-transform:uppercase;color:#5a5f73;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hero .lbl{color:#fff}

html,body{width:1100px;height:540px}

.l{position:absolute;left:50px;top:0;bottom:0;width:470px;display:flex;flex-direction:column;justify-content:center}
.kick{font-size:14px;padding:6px 14px;align-self:flex-start;margin-bottom:14px}
.ttl{font-family:IS;font-weight:700;font-size:80px;line-height:.95;letter-spacing:-2px}
.s{font-size:20px;color:#5a5f73;margin-top:10px}
.btn{margin-top:18px;align-self:flex-start;font-size:15px;padding:12px 22px}
.r{position:absolute;right:30px;top:35px;width:540px;height:470px;display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.tile{border-radius:20px}.chip{font-size:20px;padding:5px 11px;top:10px;left:10px}.lbl{font-size:11px;left:12px;bottom:10px}.t img{max-width:70%;max-height:55%}
