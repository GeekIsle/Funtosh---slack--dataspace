*{box-sizing:border-box;margin:0;padding:0}
body{font-family:FG,sans-serif;background:linear-gradient(120deg,#ffffff 0%,#fdf1f2 48%,#e6f5ec 100%);color:#020624;position:relative;overflow:hidden}
.kick{display:inline-block;font-weight:800;letter-spacing:4px;text-transform:uppercase;color:#c8102e;border:2px solid #c8102e;border-radius:999px}
.grad{color:#c8102e}

.chip{position:absolute;top:20px;left:20px;font-family:IS;font-weight:700;color:#fff;background:#c8102e;border-radius:14px}

.hero .lbl{color:#fff}

html,body{width:1100px;height:400px}

.s{font-size:20px;color:#5a5f73;margin-top:10px}
.btn{margin-top:18px;align-self:flex-start;font-size:15px;padding:12px 22px}
.r{position:absolute;right:30px;top:30px;width:520px;height:340px;display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
